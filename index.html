<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saudia Jobs Official - Final</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8faf6]">
<div class="bg-[#0a3320] text-white text-[11px] py-2 px-4 flex justify-between">
<span>🔥 12,847 Jobs | Lifetime Free - No Timer</span>
<button id="loginBtn" onclick="localStorage.setItem('user','1');this.innerText='✅ Logged In'" class="bg-white text-black px-3 py-1 rounded-full font-bold">Login</button>
</div>
<header class="bg-white p-4 flex justify-between sticky top-0 border-b">
<b>SAUDIA JOBS OFFICIAL</b>
<div class="flex gap-2">
<button onclick="openAdmin()" class="bg-zinc-100 px-3 py-1 rounded-full text-xs">⚙️ Admin</button>
<button onclick="document.getElementById('post').classList.remove('hidden')" class="bg-black text-white px-3 py-1 rounded-full text-xs">+ Post Job</button>
</div>
</header>
<div class="p-4 max-w-6xl mx-auto">
<div id="jobs" class="grid md:grid-cols-2 gap-4 mt-4"></div>
<div class="mt-10 bg-black text-white p-5 rounded-2xl">
<b>Owner Panel (Tumhara)</b><br>
<button onclick="let t=prompt('Title');if(t){jobs.unshift({t,c:'Admin',s:'Good Salary'});save()}" class="bg-white text-black px-3 py-2 rounded-full text-xs mt-2">+ Add Job</button>
<button onclick="localStorage.clear();jobs=[];render()" class="bg-zinc-800 text-white px-3 py-2 rounded-full text-xs mt-2 ml-2">Clear All</button>
<p class="text-[10px] mt-3 opacity-50">Live Link: saudiajobsofficial-wq.github.io/saudia-jobs-website/</p>
</div>
</div>
<div id="post" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
<div class="bg-white p-6 rounded-[24px] w-full max-w-md">
<b>Auto Post Job (Bahir mulk walo ke liye)</b>
<input id="pt" placeholder="Job Title" class="w-full border p-3 rounded-xl mt-3">
<input id="pc" placeholder="Company" class="w-full border p-3 rounded-xl mt-2">
<button onclick="jobs.unshift({t:pt.value,c:pc.value,s:'As per interview'});save();document.getElementById('post').classList.add('hidden');pt.value='';pc.value=''" class="w-full bg-black text-white py-3 rounded-xl mt-3">Post Live</button>
<button onclick="document.getElementById('post').classList.add('hidden')" class="w-full bg-zinc-100 py-2 rounded-xl mt-2">Cancel</button>
</div>
</div>
<script>
let jobs=JSON.parse(localStorage.getItem('j')||'null')||[{t:'Heavy Driver - Riyadh',c:'Almarai',s:'SAR 3000'},{t:'Factory Helper - Jeddah',c:'Noon',s:'SAR 1800 + OT'}];
function render(){jobsEl=document.getElementById('jobs');jobsEl.innerHTML=jobs.map((j,i)=>`<div class="bg-white p-4 rounded-2xl border"><div class="text-[10px] opacity-60">${j.c}</div><div class="font-bold">${j.t}</div><div class="text-xs bg-zinc-100 inline-block px-2 py-1 rounded-full mt-1">${j.s}</div><button onclick="jobs.splice(${i},1);save()" class="block mt-3 w-full bg-black text-white py-2 rounded-xl text-xs">Delete / Apply</button></div>`).join('')}
function save(){localStorage.setItem('j',JSON.stringify(jobs));render()}
function openAdmin(){let t=prompt('Job Title?');if(t){jobs.unshift({t,c:prompt('Company?'),s:prompt('Salary?')});save()}}
render();
</script>
</body>
</html>
